<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Sustainability Summit Check-In</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- hero section with intel branding -->
    <div class="hero">
      <div class="hero-content">
        <div class="intel-logo" aria-label="Intel">
          intel<span aria-hidden="true">.</span>
        </div>
        <h1>Team Sustainability Summit</h1>
        <div class="hero-divider"></div>
        <p>
          <i class="fas fa-leaf"></i>
          Check-in system for sustainability event attendees
        </p>
      </div>
    </div>

    <!-- attendance tracking -->
    <div class="attendance-tracker">
      <div class="attendance-header">
        <i class="fas fa-users"></i>
        Attendance: <span id="attendeeCount">0</span>/50
      </div>
      <div
        class="progress-container"
        role="progressbar"
        aria-label="Attendance goal"
        aria-valuemin="0"
        aria-valuemax="50"
        aria-valuenow="0"
      >
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="container">
      <!-- feedback messages -->
      <p id="greeting" role="status" aria-live="polite"></p>
      <div id="celebration" role="status" hidden></div>
      <p id="storageNotice" role="status" hidden></p>

      <!-- check-in form -->
      <form class="check-in" id="checkInForm">
        <label for="attendeeName" class="form-label"> Attendee Check-In </label>
        <div class="form-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="attendeeName"
              name="attendeeName"
              placeholder="Enter name..."
              aria-label="Attendee name"
              maxlength="100"
              required
            />
            <select
              id="teamSelect"
              name="team"
              aria-label="Select team"
              required
            >
              <option value="" disabled selected>Select Team...</option>
              <option value="water">Team Water Wise</option>
              <option value="zero">Team Net Zero</option>
              <option value="power">Team Renewables</option>
            </select>
          </div>
          <button type="submit" id="checkInBtn">
            <i class="fas fa-user-check"></i> Check In
          </button>
        </div>
      </form>

      <!-- team stats -->
      <div class="team-stats">
        <h3>Team Attendance</h3>
        <div class="teams-grid">
          <div class="team-card water">
            <span class="team-name">🌊 Team Water Wise</span>
            <span class="team-count" id="waterCount">0</span>
          </div>
          <div class="team-card zero">
            <span class="team-name">🌿 Team Net Zero</span>
            <span class="team-count" id="zeroCount">0</span>
          </div>
          <div class="team-card power">
            <span class="team-name">⚡ Team Renewables</span>
            <span class="team-count" id="powerCount">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- attendee names and teams -->
    <section class="attendee-list container" aria-labelledby="listHeading">
      <h3 id="listHeading">Checked-In Attendees</h3>
      <p id="emptyList">No attendees yet. Be the first to check in!</p>
      <ul id="attendeeList"></ul>
    </section>

    <footer class="footer">
      &copy; 2025 Intel •
      <a
        href="https://www.intel.com/content/www/us/en/corporate-responsibility/2030-goals.html"
        class="footer-link"
      >
        Sustainability Goals
      </a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
